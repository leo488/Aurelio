# Builds the app and publishes it to GitHub Pages (gh-pages branch), so it can be installed from Chrome.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/design-v2-llqmbc]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Deep links (e.g. /aurelio/today) load the app instead of a Pages 404.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
